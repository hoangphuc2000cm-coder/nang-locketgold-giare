<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modal-title">Xác nhận</h3>
    <p id="modal-desc"></p>
    <div class="modal-actions">

</div><script>
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('tab-' + item.dataset.tab).classList.add('active');
  });
});

const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalDesc = document.getElementById('modal-desc');
const cancelBtn = document.getElementById('cancel');
const confirmBtn = document.getElementById('confirm');
const statusEl = document.getElementById('status');
const tiktokBtn = document.getElementById('tiktokBtn');
const claimBtn = document.getElementById('claimBtn');

let selectedPlan = null;
let tiktokClicked = localStorage.getItem('tiktokClicked') === 'true';

function getGold() {
  const data = JSON.parse(localStorage.getItem('goldData') || 'null');
  if (!data) return null;
  if (Date.now() > data.expire) { localStorage.removeItem('goldData'); return null; }
  return data;
}

function renderStatus() {
  const gold = getGold();
  if (gold) {
    const remainDays = Math.ceil((gold.expire - Date.now()) / 86400000);
    statusEl.innerHTML = `Trạng thái: <b>👑 Gold (${gold.planName})</b> — còn ${remainDays} ngày`;
  } else {
    statusEl.innerHTML = `Trạng thái: <b>Free</b>`;
  }
}

document.querySelectorAll('.buy').forEach(btn => {
  btn.addEventListener('click', () => {
    const plan = btn.parentElement;
    const name = plan.querySelector('h2').textContent;
    const price = Number(plan.dataset.price);
    selectedPlan = { id: plan.dataset.plan, days: Number(plan.dataset.days), price: price, name: name };
    modalTitle.textContent = 'Gói ' + name;
    modalDesc.innerHTML = 'Số tiền: <b style="color:#b47cff;font-size:18px">' + price.toLocaleString('vi-VN') + 'đ</b><br><br>Vui lòng liên hệ:<br><b style="color:#b47cff;font-size:22px">0916678949</b><br><br>Sau khi thanh toán, bấm <b>Xác nhận</b>.';
    modal.classList.add('active');
  });
});

cancelBtn.addEventListener('click', () => modal.classList.remove('active'));

confirmBtn.addEventListener('click', () => {
  if (!selectedPlan) return;
  const now = Date.now();
  const expire = now + selectedPlan.days * 86400000;
  localStorage.setItem('goldData', JSON.stringify({
    plan: selectedPlan.id, planName: selectedPlan.name,
    price: selectedPlan.price, startedAt: now, expire: expire
  }));
  modal.classList.remove('active');
  alert('✅ Đã kích hoạt gói ' + selectedPlan.name + '!\nLiên hệ: 0916678949');
  renderStatus();
  selectedPlan = null;
});

modal.addEventListener('click', e => {
  if (e.target === modal) modal.classList.remove('active');
});

function updateClaimBtn() {
  if (tiktokClicked) {
    claimBtn.disabled = false;
    claimBtn.classList.add('ready');
    claimBtn.textContent = '🎁 Nhận Gold FREE 1 ngày';
  } else {
    claimBtn.disabled = true;
    claimBtn.classList.remove('ready');
    claimBtn.textContent = '⏳ Hãy follow trước';
  }
}

tiktokBtn.addEventListener('click', () => {
  tiktokClicked = true;
  localStorage.setItem('tiktokClicked', 'true');
  updateClaimBtn();
});

claimBtn.addEventListener('click', () => {
  if (!tiktokClicked) return;
  if (localStorage.getItem('freeClaimed') === 'true') {
    alert('⚠️ Bạn đã nhận free 1 lần rồi!');
    return;
  }
  const now = Date.now();
  localStorage.setItem('goldData', JSON.stringify({
    plan: 'day', planName: '1 Ngày (Free)', price: 0,
    startedAt: now, expire: now + 86400000
  }));
  localStorage.setItem('freeClaimed', 'true');
  alert('✅ Đã kích hoạt Gold FREE 1 ngày!\nCảm ơn bạn 💖');
  renderStatus();
});

updateClaimBtn();
renderStatus();
</script>
